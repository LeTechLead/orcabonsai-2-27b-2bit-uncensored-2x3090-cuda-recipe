# OrcaBonsai Ternary Bonsai 2 27B Uncensored — OpenAI-compatible server with the runtime
# refusal-direction ablation applied.
#
# Runs the PUBLISHED IMAGE, so there is nothing to build:
#
#   docker compose up -d
#
# The image is a PrismML llama.cpp fork (the only runtime with the ternary PQ2_0 kernels)
# with the upstream rank-1 LoRA adapter baked in. Its Dockerfiles are in this repository —
# see the "Building from source instead" section of the README if you would rather compile
# it yourself, or you are on a GPU architecture the published image was not built for.
#
# The model weights are NOT in the image. Put the GGUF in ./models (default) or point
# MODEL_DIR at wherever it lives.

services:
  orcabonsai:
    image: ${SERVICE_IMAGE:-ghcr.io/letechlead/orcabonsai-27b-serving:latest}
    container_name: orcabonsai-27b
    # Requires Docker 27+ / Compose v2.30+. On older setups, comment this out and use
    # the deploy.resources block at the bottom of this service instead.
    gpus: all
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "${PORT:-8080}:8080"
    command:
      - "-m"
      - "/models/${MODEL_FILE:-Ternary-Bonsai-2-27B-PQ2_0.gguf}"
      # The ablation, applied at inference time. :1.0 IS the exact projection
      # (llama.cpp computes scale = adapter_scale * alpha / rank, and this adapter is
      # alpha 1.0 rank 1). 0 = published behaviour, 2 = flips stubborn refusals.
      - "--lora-scaled"
      - "/app/gguf/bonsai-abliterate-lora.gguf:${BONSAI_ALPHA:-1.0}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "99"
      # No --tensor-split here on purpose: llama.cpp spreads the model across every
      # visible GPU by itself, so this runs on one card or on several with no edit.
      # Add an explicit --tensor-split only for lopsided cards (e.g. "70,30" to match
      # a 24 GB + 12 GB pair), and lower --n-gpu-layers if a card cannot hold its share.
      - "--flash-attn"
      - "on"
      - "--ctx-size"
      - "${BONSAI_CTX:-262144}"
      - "--cache-type-k"
      - "${BONSAI_KV_TYPE:-q8_0}"
      - "--cache-type-v"
      - "${BONSAI_KV_TYPE:-q8_0}"
      - "--batch-size"
      - "2048"
      - "--ubatch-size"
      - "1024"
      - "--parallel"
      - "1"
      - "--jinja"
      - "--temp"
      - "1.0"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0.0"
      - "--repeat-penalty"
      - "1.0"
      - "--metrics"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    # Older Docker without `gpus:` support — use this instead of the gpus key:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
